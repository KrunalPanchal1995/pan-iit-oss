[project]
name = "openseismo"
version = "0.1.0"
description = "Learn how seismologists locate an earthquake: S-P times, circles, least squares and error ellipses, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
