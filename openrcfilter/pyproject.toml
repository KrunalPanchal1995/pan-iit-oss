[project]
name = "openrcfilter"
version = "0.1.0"
description = "Learn RC filters, Bode plots and digital low-pass filters, then design a filter for a noisy sensor, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
