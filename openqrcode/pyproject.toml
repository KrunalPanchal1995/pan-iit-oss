[project]
name = "openqrcode"
version = "0.1.0"
description = "Learn how a damaged QR code can still be read: check digits, Hamming codes and interleaving, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
