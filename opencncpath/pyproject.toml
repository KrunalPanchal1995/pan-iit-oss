[project]
name = "opencncpath"
version = "0.1.0"
description = "Learn how a CNC machine follows a toolpath: G-code, offsets, pocketing and a simulation that checks the result, from scratch in 5 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
