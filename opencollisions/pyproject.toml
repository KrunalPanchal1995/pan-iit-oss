[project]
name = "opencollisions"
version = "0.1.0"
description = "Learn how bodies move after a collision: momentum, restitution, energy lost and off-centre hits of discs, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
