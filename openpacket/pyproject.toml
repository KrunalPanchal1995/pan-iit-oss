[project]
name = "openpacket"
version = "0.1.0"
description = "Cut a message into packets, route them hop by hop and simulate queues, loss and link failures, from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
