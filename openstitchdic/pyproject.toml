[project]
name = "openstitchdic"
version = "0.1.0"
description = "Merge two cameras with different angles, frame rates and aspect ratios into one uniform data set (homography, resampling, Makima), in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
