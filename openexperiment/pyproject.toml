[project]
name = "openexperiment"
version = "0.1.0"
description = "Learn fair tests, sensor calibration and experimental design (randomisation, replication, factorial runs) from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
