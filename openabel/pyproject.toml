[project]
name = "openabel"
version = "0.1.0"
description = "Learn how one side-view photo reveals the inside of a flame: line integrals, the Abel transform, inversion and noise, in 5 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
