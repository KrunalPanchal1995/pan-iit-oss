[project]
name = "openheatspread"
version = "0.1.0"
description = "Learn heat conduction and predict laptop hot spots: Fourier's law, thermal resistance and a 2D finite-difference solver, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
