[project]
name = "opendronecontrol"
version = "0.1.0"
description = "Learn how a drone hovers and holds its attitude: thrust, feedback and PID control of a quadrotor, from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
