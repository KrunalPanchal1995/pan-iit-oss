[project]
name = "openproteinmd"
version = "0.1.0"
description = "Learn molecular dynamics: atoms on springs, velocity Verlet, and a toy bead-chain peptide that folds. 3 sessions, numpy only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
