[project]
name = "openfridge"
version = "0.1.0"
description = "Learn how a refrigerator moves heat from cold to warm: energy balance, COP, the Carnot limit and a toy vapour-compression cycle, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
