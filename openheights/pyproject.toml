[project]
name = "openheights"
version = "0.1.0"
description = "Measure the height of a tower or tree with trigonometry and a phone: shadows, angles, errors and simulation in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
