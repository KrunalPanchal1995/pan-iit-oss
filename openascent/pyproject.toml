[project]
name = "openascent"
version = "0.1.0"
description = "Fly a rocket to orbit with staging: the rocket equation, gravity and drag losses, and a gravity-turn ascent, from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
