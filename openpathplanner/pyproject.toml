[project]
name = "openpathplanner"
version = "0.1.0"
description = "Learn path planning: BFS, Dijkstra, A*, RRT and RRT* for a warehouse robot, from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
