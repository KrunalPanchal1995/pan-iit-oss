[project]
name = "openpinn"
version = "0.1.0"
description = "Learn physics-informed neural networks: a hand-coded numpy network that solves u' = -u and the 1D heat equation, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
