[project]
name = "openclassifier"
version = "0.1.0"
description = "Learn how classifiers decide and how to tell a good one from a lucky one: boundaries, trees, confusion matrices, ROC, fairness, in 5 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
