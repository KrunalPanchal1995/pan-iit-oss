[project]
name = "openmotion"
version = "0.1.0"
description = "Read position, velocity and acceleration graphs of a moving body, from a car on a road to noisy phone data, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
