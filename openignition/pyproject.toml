[project]
name = "openignition"
version = "0.1.0"
description = "Learn why mixtures ignite after a delay and how stiff solvers predict it: Arrhenius runaway, ln(delay) laws and implicit integrators, from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
