[project]
name = "openneuron"
version = "0.1.0"
description = "Learn how a nerve cell fires and how its signal travels: threshold, RC membrane, and Hodgkin-Huxley, from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
