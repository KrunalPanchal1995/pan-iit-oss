[project]
name = "openstereodic"
version = "0.1.0"
description = "Learn how two cameras and a speckle pattern measure 3D shape and strain: parallax, sub-pixel matching and image correlation, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
