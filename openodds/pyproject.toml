[project]
name = "openodds"
version = "0.1.0"
description = "Learn probability by counting and by Monte Carlo simulation: dice, cards, birthdays and lotteries, from scratch in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
