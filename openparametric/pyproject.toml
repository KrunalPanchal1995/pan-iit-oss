[project]
name = "openparametric"
version = "0.1.0"
description = "Learn how rules and equations generate engineered parts: a shaft size from torque, strength against stiffness, and a rule engine that draws a flange, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
