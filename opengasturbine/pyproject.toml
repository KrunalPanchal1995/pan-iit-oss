[project]
name = "opengasturbine"
version = "0.1.0"
description = "Learn how a gas turbine makes power and thrust: the Brayton cycle, the best pressure ratio and a turbojet with real losses, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
