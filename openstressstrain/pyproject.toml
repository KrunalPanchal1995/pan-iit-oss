[project]
name = "openstressstrain"
version = "0.1.0"
description = "Learn stress, strain, Hooke's law and yield, and choose a safe material and size for a hanging load, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
